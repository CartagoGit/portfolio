<main
	class="portfolio"
	[class.light-mode]="lightMode()">
	<a
		class="skip-link"
		href="#main-content">
		Skip to content
	</a>

	<app-portfolio-header
		[locale]="locale()"
		[page]="page()"
		[copy]="copy()"
		[languages]="languages"
		[menuOpen]="menuOpen()"
		[localeMenuOpen]="localeMenuOpen()"
		[localeMenuClosing]="localeMenuClosing()"
		[lightMode]="lightMode()"
		[scrolled]="scrolled()"
		(navigate)="setTransition($event)"
		(menuToggle)="toggleMenu()"
		(localeToggle)="toggleLocaleMenu()"
		(localeSelect)="selectLocale($event)"
		(themeToggle)="setTheme()" />
	<div class="route-stage">
		@if (page() === 'home') {
			<section
				id="main-content"
				class="hero"
				aria-labelledby="hero-title">
				<app-home-intro
					[copy]="copy()"
					[locale]="locale()"
					[technologies]="technologyMarquee"
					[links]="publicLinks"
					(navigate)="setTransition($event)" />
				<app-hero-monitor />
			</section>
		}

		@if (page() === 'work') {
			<app-work-page />
		}

		@if (page() === 'approach') {
			<app-approach-page />
		}

		@if (page() === 'knowledge') {
			<app-knowledge-page />
		}

		@if (page() === 'docker') {
			<app-docker-page />
		}

		@if (page() === 'demos') {
			<app-demos-page />
		}

		@if (page() === 'lab') {
			<app-lab-page (commandRequested)="commandOpen.set(true)" />
		}

		@if (page() === 'contact') {
			<app-contact-page />
		}
	</div>

	<app-portfolio-footer
		[locale]="locale()"
		[links]="publicLinks" />

	<app-command-palette
		[open]="commandOpen()"
		[locale]="locale()"
		(close)="commandOpen.set(false)"
		(navigate)="setTransition($event)" />
</main>
