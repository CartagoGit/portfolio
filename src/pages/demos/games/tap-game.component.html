<section class="tap-game" aria-labelledby="tap-game-title">
	<div class="tap-game__copy">
		<p>{{ 'pages.demos.tapEyebrow' | translate }}</p>
		<h3 id="tap-game-title">{{ 'pages.demos.tapTitle' | translate }}</h3>
		<p>{{ 'pages.demos.tapDetail' | translate }}</p>
		<b>{{ taps() }} / {{ goal() }} <small>{{ 'pages.demos.tapGoal' | translate }}</small></b>
		<button type="button" (click)="reset()">{{ 'pages.demos.resetButton' | translate }}</button>
	</div>
	<div class="tap-game__board">
		<button type="button" [disabled]="taps() >= goal()" (click)="tap()">
			<span>{{ taps() >= goal() ? ('pages.demos.tapDone' | translate) : ('pages.demos.tapButton' | translate) }}</span>
			<i [style.--tap-progress]="(taps() / goal()) * 100" aria-hidden="true"></i>
		</button>
	</div>
</section>
