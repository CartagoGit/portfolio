<section class="dice-game" aria-labelledby="dice-game-title">
	<div class="dice-game__copy">
		<p>{{ 'pages.demos.diceEyebrow' | translate }}</p>
		<h3 id="dice-game-title">{{ 'pages.demos.diceTitle' | translate }}</h3>
		<p>{{ 'pages.demos.diceDetail' | translate }}</p>
		<button type="button" (click)="roll()">{{ 'pages.demos.diceRoll' | translate }}</button>
	</div>
	<div class="dice-game__board">
		<button class="dice-game__die" type="button" (click)="roll()" [attr.aria-label]="'pages.demos.diceRoll' | translate">{{ faces[value() - 1] }}</button>
		<div class="dice-game__history" aria-live="polite">
			@for (roll of rolls(); track $index) { <span>{{ faces[roll - 1] }}</span> }
		</div>
	</div>
</section>
