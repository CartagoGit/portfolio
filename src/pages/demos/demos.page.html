<section class="demos-page" aria-labelledby="demos-title">
	<div class="demos-page__heading">
		<p>{{ 'pages.demos.eyebrow' | translate }}</p>
		<h2 id="demos-title">
			{{ 'pages.demos.titleLead' | translate }}
			<br />
			<em>{{ 'pages.demos.titleEmphasis' | translate }}</em>
			{{ 'pages.demos.titleTail' | translate }}
		</h2>
		<p>{{ 'pages.demos.subtitle' | translate }}</p>
	</div>

	<app-demos-showcase />

	<app-demo-games />

	<section
		class="demos-page__links"
		[attr.aria-label]="'pages.demos.externalLinksAria' | translate">
		@for (demo of demos; track demo.title) {
			<app-evidence-card
				[href]="demo.url"
				[title]="demo.title"
				[number]="demo.number"
				[summary]="demo.summaryKey | translate"
				[openLabel]="'pages.demos.openDemo' | translate"
				[imageSrc]="demo.imageSrc"
				[iconPath]="demo.iconPath"
				[visualIdentity]="demo.title" />
		}
	</section>
</section>
