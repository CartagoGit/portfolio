<div
	class="arcade-control-pad"
	[class.arcade-control-pad--with-action]="actionLabelKey() !== null"
	[attr.data-tone]="actionTone()">
	<div class="arcade-control-pad__console">
		<div class="arcade-control-pad__pad" [class]="padClass()" [attr.aria-label]="'directionalControls' | arcadeText">
			@if (hasDirection('up')) {
				<button
					type="button"
					class="arcade-control-pad__direction arcade-control-pad__direction--up"
					[class.arcade-control-pad__direction--pressed]="pressedDirection() === 'up'"
					[disabled]="disabled()"
					[attr.aria-label]="'up' | arcadeText"
					aria-keyshortcuts="ArrowUp W"
					(click)="pressDirection('up')">
					<span aria-hidden="true">↑</span>
				</button>
			}
			@if (hasDirection('left')) {
				<button
					type="button"
					class="arcade-control-pad__direction arcade-control-pad__direction--left"
					[class.arcade-control-pad__direction--pressed]="pressedDirection() === 'left'"
					[disabled]="disabled()"
					[attr.aria-label]="'left' | arcadeText"
					aria-keyshortcuts="ArrowLeft A"
					(click)="pressDirection('left')">
					<span aria-hidden="true">←</span>
				</button>
			}
			<span class="arcade-control-pad__stick" aria-hidden="true"><i></i></span>
			@if (hasDirection('right')) {
				<button
					type="button"
					class="arcade-control-pad__direction arcade-control-pad__direction--right"
					[class.arcade-control-pad__direction--pressed]="pressedDirection() === 'right'"
					[disabled]="disabled()"
					[attr.aria-label]="'right' | arcadeText"
					aria-keyshortcuts="ArrowRight D"
					(click)="pressDirection('right')">
					<span aria-hidden="true">→</span>
				</button>
			}
			@if (hasDirection('down')) {
				<button
					type="button"
					class="arcade-control-pad__direction arcade-control-pad__direction--down"
					[class.arcade-control-pad__direction--pressed]="pressedDirection() === 'down'"
					[disabled]="disabled()"
					[attr.aria-label]="'down' | arcadeText"
					aria-keyshortcuts="ArrowDown S"
					(click)="pressDirection('down')">
					<span aria-hidden="true">↓</span>
				</button>
			}
		</div>

		<div class="arcade-control-pad__input-labels" [attr.aria-label]="'keysTouch' | arcadeText">
			<span>
				<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3" /><path d="M7 10h2m2 0h2m2 0h2M7 14h2m2 0h6" /></svg>
				<kbd>{{ keyboardHint() }}</kbd>
			</span>
			<span>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v5-2a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v5c0 4-3 7-7 7h-1c-3 0-5-2-7-5l-2-3a2 2 0 0 1 3-2l2 2" /></svg>
				<small>{{ 'touch' | arcadeText }}</small>
			</span>
		</div>
	</div>

	@if (actionLabelKey(); as labelKey) {
		<div class="arcade-control-pad__action-cluster" [class]="actionClass()">
			<span class="arcade-control-pad__action-halo" aria-hidden="true"></span>
			<button
				type="button"
				class="arcade-control-pad__action"
				[class.arcade-control-pad__action--pressed]="actionIsPressed()"
				[disabled]="disabled()"
				[attr.aria-label]="labelKey | arcadeText"
				[attr.aria-keyshortcuts]="actionHint()"
				(click)="pressAction()">
				<span class="arcade-control-pad__action-icon" aria-hidden="true"><i></i></span>
				<strong>{{ labelKey | arcadeText }}</strong>
				<kbd>{{ actionHint() }}</kbd>
			</button>
		</div>
	}
</div>
