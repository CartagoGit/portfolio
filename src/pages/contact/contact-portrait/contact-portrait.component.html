<figure class="contact-portrait">
	<div class="contact-portrait__frame">
		<img
			src="/images/mario-cabrero-sf.png"
			[attr.alt]="'pages.contact.portraitAlt' | translate"
			width="900"
			height="1125"
			fetchpriority="high"
			decoding="async" />
		<span class="contact-portrait__index" aria-hidden="true">07</span>
	</div>
	<figcaption>
		<span>{{ 'pages.contact.portraitCaption' | translate }}</span>
		<i aria-hidden="true">Cartago · 2026</i>
	</figcaption>
</figure>
