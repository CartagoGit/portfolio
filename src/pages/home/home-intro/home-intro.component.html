<div class="home-intro">
	<p class="home-intro__eyebrow">
		<span></span>
		CartagoNova / personal frontend systems
	</p>
	<h1 id="hero-title">
		Mario Cabrero
		<br />
		<em>Volarich</em>
	</h1>
	<p class="home-intro__signature">
		Cartago / CartagoNova · frontend product engineer
	</p>
	<p class="home-intro__role">{{ copy().role }}</p>
	<p class="home-intro__description">{{ copy().intro }}</p>
	<div class="home-intro__actions">
		<a
			[routerLink]="['/', locale(), 'demos']"
			(click)="navigate.emit('demos')">
			{{ copy().viewWork }}
			<span aria-hidden="true">↘</span>
		</a>
		<a
			[routerLink]="['/', locale(), 'contact']"
			(click)="navigate.emit('contact')">
			{{ copy().contact }}
			<span aria-hidden="true">→</span>
		</a>
	</div>
	<app-technology-marquee [technologies]="technologies()" />
	<app-profile-links [links]="links()" />
</div>
