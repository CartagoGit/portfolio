<div class="home-intro">
	<p class="home-intro__eyebrow">
		<span></span>
		{{ 'pages.home.eyebrow' | translate }}
	</p>
	<div class="home-intro__identity">
		<img
			class="home-intro__mark"
			src="/icons/cartago.svg"
			alt=""
			width="88"
			height="88" />
		<h1 id="hero-title">
			Mario Cabrero
			<br />
			<em>Volarich</em>
		</h1>
	</div>
	<p class="home-intro__signature">Cartago · Angular · TypeScript · Ionic</p>
	<p class="home-intro__role">{{ 'pages.home.role' | translate }}</p>
	<p class="home-intro__description">
		{{ 'pages.home.intro' | translate }}
	</p>
	<div class="home-intro__actions">
		<a
			[routerLink]="['/', locale(), 'work']"
			(click)="navigate.emit('work')">
			{{ 'pages.home.ctaWork' | translate }}
			<span aria-hidden="true">↘</span>
		</a>
		<a
			[routerLink]="['/', locale(), 'contact']"
			(click)="navigate.emit('contact')">
			{{ 'pages.home.ctaContact' | translate }}
			<span aria-hidden="true">→</span>
		</a>
	</div>
	<app-technology-marquee
		[technologies]="technologies()"
		(preview)="preview.emit($event)" />
	<app-profile-links
		[links]="links()"
		(preview)="preview.emit($event)" />
	<app-technology-marquee
		[technologies]="technologies()"
		[reverse]="true"
		(preview)="preview.emit($event)" />
</div>
