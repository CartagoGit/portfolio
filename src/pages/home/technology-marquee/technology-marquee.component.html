<div
	class="technology-marquee"
	[class.technology-marquee--reverse]="reverse()"
	[attr.aria-label]="'pages.home.technologyIndexAria' | translate">
	@for (duplicate of [false, true]; track duplicate) {
		<div
			class="technology-marquee__track"
			[attr.aria-hidden]="duplicate || null">
			@for (technology of technologies(); track technology.label) {
				<span
					class="technology-marquee__token"
					[attr.tabindex]="duplicate ? -1 : 0"
					(mouseenter)="showTooltip(technology, $event)"
					(mouseleave)="hideTooltip()"
					(focusin)="showTooltip(technology, $event)"
					(focusout)="hideTooltip()"
					[style.--label-width.px]="technology.label.length * 8 + 44">
					<svg
						viewBox="0 0 24 24"
						aria-hidden="true">
						<path
							[attr.d]="technology.iconPath"
							[attr.fill]="technology.color" />
					</svg>
					<b>{{ technology.label }}</b>
				</span>
			}
		</div>
	}
</div>
@if (tooltip(); as activeTooltip) {
	<div
		class="technology-marquee__tooltip"
		role="tooltip"
		[style.left.px]="tooltipX()"
		[style.top.px]="tooltipY()">
		{{ activeTooltip.label }}
	</div>
}
