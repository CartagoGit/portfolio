<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Cartago — Frontend engineer · Angular + SCSS</title>
		<meta
			name="description"
			content="Mario Cabrero Volarich — frontend engineer building operational web and mobile products with Angular, TypeScript, SCSS, Ionic, Bun and NestJS." />
		<meta
			name="theme-color"
			content="#090a12" />
		<base href="/" />
		<script>
			(() => {
				const supported = new Set(['dark', 'light', 'midnight', 'ocean', 'forest', 'sunset', 'solar', 'mono']);
				let theme = null;
				try { theme = localStorage.getItem('cartago-theme'); } catch {}
				if (!theme) {
					const match = document.cookie.match(/(?:^|;\s*)cartago_theme=([^;]+)/);
					theme = match?.[1] ?? null;
				}
				if (theme && supported.has(theme)) document.documentElement.dataset.theme = theme;
			})()
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/icons/cartago.svg" />
		<link
			rel="icon"
			type="image/png"
			href="/favicon.png" />
		<link
			rel="apple-touch-icon"
			href="/favicon.png" />
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
