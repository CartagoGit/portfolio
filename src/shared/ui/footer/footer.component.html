<footer class="footer">
	<p class="footer__copyright">© 2026 Mario Cabrero Volarich.</p>
	<nav
		class="footer__links"
		[attr.aria-label]="'chrome.footer.connectLabel' | translate">
		<app-profile-links
			[links]="links()"
			[compact]="true" />
	</nav>
	<button
		class="footer__top"
		type="button"
		(click)="backToTop.emit()"
		[attr.aria-label]="'chrome.footer.backToTop' | translate">
		{{ 'chrome.footer.backToTop' | translate }}
	</button>
</footer>
