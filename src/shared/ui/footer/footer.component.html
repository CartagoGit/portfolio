<footer class="footer">
	<a
		class="footer__brand"
		[routerLink]="['/', locale()]">
		<span class="footer__mark">C.</span>
		<span>Cartago</span>
	</a>
	<p class="footer__copyright">© 2026 Mario Cabrero Volarich.</p>
	<nav
		class="footer__links"
		[attr.aria-label]="'chrome.footer.connectLabel' | translate">
		@for (link of links(); track link.href) {
			<a
				class="footer__link"
				[href]="link.href"
				target="_blank"
				rel="noreferrer">
				@if (link.imageSrc) {
					<img
						class="footer__icon"
						[src]="link.imageSrc"
						alt="" />
				} @else {
					<svg
						class="footer__icon"
						viewBox="0 0 24 24"
						aria-hidden="true">
						<path
							[attr.d]="link.iconPath"
							[attr.fill]="link.color ?? 'currentColor'" />
					</svg>
				}
				<span>{{ link.label }}</span>
			</a>
		}
	</nav>
	<a
		class="footer__top"
		href="#main-content">
		{{ 'chrome.footer.backToTop' | translate }}
	</a>
</footer>
