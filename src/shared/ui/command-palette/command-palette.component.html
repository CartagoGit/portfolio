@if (open()) {
	<div
		class="command-palette"
		(click)="close.emit()">
		<section
			class="command-palette__dialog"
			role="dialog"
			aria-modal="true"
			aria-labelledby="command-title"
			(click)="$event.stopPropagation()">
			<div class="command-palette__heading">
				<p id="command-title">
					{{ 'chrome.commandPalette.title' | translate }}
				</p>
				<button
					type="button"
					(click)="close.emit()"
					[attr.aria-label]="
						'chrome.commandPalette.close' | translate
					">
					×
				</button>
			</div>
			<label class="command-palette__search">
				{{ 'chrome.commandPalette.searchLabel' | translate }}
				<input
					autofocus
					[attr.placeholder]="
						'chrome.commandPalette.searchPlaceholder' | translate
					" />
			</label>
			<a
				[routerLink]="routeFor('work')"
				(click)="select('work')">
				<span>↗</span>
				{{ 'chrome.commandPalette.cmdViewWork' | translate }}
				<kbd>↵</kbd>
			</a>
			<a
				[routerLink]="routeFor('lab')"
				(click)="select('lab')">
				<span>✦</span>
				{{ 'chrome.commandPalette.cmdLab' | translate }}
				<kbd>↵</kbd>
			</a>
			<a
				[routerLink]="routeFor('contact')"
				(click)="select('contact')">
				<span>✉</span>
				{{ 'chrome.commandPalette.cmdContact' | translate }}
				<kbd>↵</kbd>
			</a>
		</section>
	</div>
}
